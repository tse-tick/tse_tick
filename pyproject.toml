[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tse-tick"
version = "0.11.6"
description = "High-performance Nikkei NEEDS tick data processing with Polars"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Kazumi Li"},
    {name = "Masataka Hayashi"},
    {name = "Peter Romero"},
]
maintainers = [
    {name = "Kazumi Li", email = "kaiwenli@keio.jp"},
]
keywords = [
    "finance",
    "nikkei",
    "tick-data",
    "market-data",
    "japan",
    "stock",
    "trading",
    "financial-data",
    "time-series",
    "polars",
    "parquet",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "polars>=0.20.0",
    "pyarrow>=12.0.0",
]

[project.optional-dependencies]
query = [
    "duckdb>=0.9.0",
]
test = [
    "pandas>=1.5.0",
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
dev = [
    "pandas>=1.5.0",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=22.0",
    "flake8>=5.0",
    "mypy>=0.991",
    "jupyter>=1.0",
    "notebook>=6.5",
    "ipykernel>=6.20",
]

docs = [
    "sphinx>=5.0",
    "sphinx-rtd-theme>=1.0",
    "sphinx-autodoc-typehints>=1.19",
    "myst-parser>=0.18",
]

[project.scripts]
tse-tick = "tse_tick.cli:main"

[project.urls]
Homepage = "https://github.com/tse-tick/tse_tick"
Repository = "https://github.com/tse-tick/tse_tick"
"Bug Tracker" = "https://github.com/tse-tick/tse_tick/issues"
Changelog = "https://github.com/tse-tick/tse_tick/blob/main/CHANGELOG.md"

# Tool configurations
[tool.setuptools.packages.find]
where = ["."]
include = ["tse_tick*"]

[tool.setuptools.package-data]
tse_tick = ["py.typed", "data/*.json"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --cov=tse_tick --cov-report=html --cov-report=term"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["tse_tick"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "E266", "E501", "W503"]
exclude = [
    ".git",
    "__pycache__",
    "docs/source/conf.py",
    "old",
    "build",
    "dist",
    ".eggs",
    "*.egg",
]
per-file-ignores = [
    "__init__.py:F401",
]
