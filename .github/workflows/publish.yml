name: publish

# Build the distributions and publish to PyPI via trusted publishing (OIDC) —
# no stored API token. Real publish fires when a GitHub Release is published;
# a manual run (workflow_dispatch) can dry-run to TestPyPI first.
#
# One-time external setup (see PYPI_RELEASE_PLAN.md, Phase C2):
#   - PyPI: add a pending trusted publisher for project "tse-tick", this repo,
#     workflow "publish.yml", environment "pypi".
#   - GitHub: create the "pypi" Environment (and "testpypi" for the dry run).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish on a manual run"
        type: choice
        options: [testpypi, pypi]
        default: testpypi

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Check metadata
        run: pipx run twine check dist/*
      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Real publish on a GitHub Release, or a manual run that selects "pypi".
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    environment: pypi
    permissions:
      id-token: write   # OIDC token for trusted publishing — no API token needed
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-testpypi:
    name: Publish to TestPyPI (dry run)
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
